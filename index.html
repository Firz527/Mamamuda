<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web By Firzz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Foto background kamu */
            background: url('https://i.ibb.co/cKRMDmsL/IMG-20260517-110858.jpg') center/cover no-repeat;
            font-family: 'Poppins', sans-serif;
            position: relative;
            /* BACKGROUND: MEMUDAR CEPAT & HILANG TOTAL */
            animation: bgMemudarHilang 1s ease 4.5s forwards;
        }

        /* Lapisan gelap ikut jadi hitam pekat */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.35);
            z-index: 1;
            animation: gelapPenuh 1s ease 4.5s forwards;
        }

        .wadah-teks {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .baris-1, .baris-2 {
            font-weight: 900;
            font-size: 3.8rem;
            line-height: 1.3;
            overflow: hidden;
            white-space: nowrap;
            /* Gradasi perak di tulisan */
            background: linear-gradient(135deg, #ffffff 0%, #e5e5e5 25%, #a9a9a9 50%, #e8e8e8 75%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
            border-right: 4px solid #ffffff;
            width: fit-content;
            margin: 0 auto;
            opacity: 0;
        }

        /* BARIS ATAS: CEPAT - Ketik -> Diam -> Hapus TERAKHIR */
        .baris-1 {
            animation:
                ketik 0.8s steps(20) 0.1s forwards,
                diam 0.5s 0.9s forwards,
                hapus 0.8s steps(20) 3s forwards;
        }

        /* BARIS BAWAH: CEPAT - Ketik -> Diam -> Hapus DULUAN */
        .baris-2 {
            animation:
                ketik 0.8s steps(8) 1s forwards,
                diam 0.5s 1.8s forwards,
                hapus 0.8s steps(8) 2.3s forwards;
        }

        @keyframes ketik {
            0% { max-width: 0; opacity: 1; }
            100% { max-width: 100%; border-right: 4px solid #fff; opacity: 1; }
        }

        @keyframes diam {
            0%, 100% { opacity: 1; border-right: none; }
        }

        @keyframes hapus {
            0% { max-width: 100%; opacity: 1; border-right: 4px solid #fff; }
            100% { max-width: 0; opacity: 0; border-right: none; }
        }

        /* INI DIA: BACKGROUND MEMUDAR LALU HILANG 100% */
        @keyframes bgMemudarHilang {
            0% { 
                opacity: 1; 
                background-size: cover;
                background-position: center;
            }
            100% { 
                opacity: 0; 
                visibility: hidden; 
                background: #000;
            }
        }

        @keyframes gelapPenuh {
            0% { background-color: rgba(0, 0, 0, 0.35); }
            100% { background-color: #000000; }
        }

        @media (max-width: 768px) {
            .baris-1, .baris-2 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="wadah-teks">
        <div class="baris-1">SELAMAT DATANG DI WEB</div>
        <div class="baris-2">BY FIRZZ</div>
    </div>
</body>
</html>
